services:
  # 1. AICTE IRCCIP Backend API Service
  - type: web
    name: aicte-irccip-backend
    env: python
    rootDir: IMP/backend
    buildCommand: pip install -r requirements.txt
    startCommand: python deploy_db.py && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: DATABASE_URL
        fromDatabase:
          name: aicte-irccip-postgres
          property: connectionString
      - key: CORS_ORIGINS
        value: "*"

  # 2. AICTE IRCCIP Web Dashboard Frontend
  - type: web
    name: aicte-irccip-dashboard
    env: static
    rootDir: IMP/frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

# 3. Managed Cloud PostgreSQL 15 Database
databases:
  - name: aicte-irccip-postgres
    plan: free
    databaseName: aicte_irccip
    user: aicte_admin
